name: Build

# Pull requests (into develop or main) run the tests and build the app. Pushes to develop and main
# keep a downloadable test build under the run's Artifacts. A vX.Y.Z tag publishes a GitHub Release.
on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push to the same pull request or branch cancels the run still going; tag builds always finish.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: write  # needed to create a GitHub Release on tag pushes

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Toolchain
        run: swift --version

      - name: Test
        run: swift test

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_REF_NAME" == "develop" ]]; then
            VERSION="0.0.0-develop.${GITHUB_SHA::7}"
          else
            VERSION="0.0.0-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build universal app
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/build-app.sh --universal

      - name: Zip
        id: zip
        run: |
          ZIP="MongoGram-${{ steps.version.outputs.version }}.zip"
          # ditto keeps the bundle's symlinks, permissions and signature intact.
          ditto -c -k --keepParent build/MongoGram.app "$ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MongoGram-${{ steps.version.outputs.version }}
          path: ${{ steps.zip.outputs.zip }}
          if-no-files-found: error

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # v0.x.y and suffixed tags (v1.0.0-beta.1) are pre-releases: shown with a badge, never "Latest".
          FLAGS=()
          if [[ "$GITHUB_REF_NAME" == v0.* || "$GITHUB_REF_NAME" == *-* ]]; then FLAGS+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${{ steps.zip.outputs.zip }}" \
            --title "MongoGram $GITHUB_REF_NAME" --generate-notes "${FLAGS[@]}"
