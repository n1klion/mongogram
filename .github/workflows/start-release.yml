name: Start release

# Run by hand (Actions → Start release → Run workflow) once develop is tested. It checks that the
# latest develop commit passed build.yml, creates release/vX.Y.Z from it and opens the pull request
# into main. Merging that pull request publishes the release (release-publish.yml).
#
# Needs Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the last version to raise (ignored when "version" is set)
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Exact version instead, e.g. 0.3.0 or 1.0.0-beta.1 (optional)
        type: string
        required: false
      allow_untested:
        description: Start even if develop's latest build didn't pass
        type: boolean
        default: false

permissions:
  contents: write       # create the release branch
  pull-requests: write  # open the pull request
  actions: write        # start main-source.yml on the branch
  checks: read          # read develop's build result

concurrency:
  group: start-release

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0  # tags and history for the version and the notes

      - name: Check that develop is tested
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_UNTESTED: ${{ inputs.allow_untested }}
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_ENV"
          result=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?check_name=build" \
            --jq '[.check_runs[] | (.conclusion // .status)] | first // "missing"')
          echo "develop ${sha::7}: build is $result"
          if [[ "$result" != "success" ]]; then
            if [[ "$ALLOW_UNTESTED" == "true" ]]; then
              echo "::warning::develop ${sha::7} build is '$result'; starting anyway because allow_untested is set"
            else
              echo "::error::develop ${sha::7} build is '$result', not 'success'. Wait for it to pass (or fix develop), then run this again."
              exit 1
            fi
          fi
          if git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::main already contains develop ${sha::7}; there is nothing to release."
            exit 1
          fi

      - name: Pick the version
        env:
          BUMP: ${{ inputs.bump }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          last=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          last=${last:-v0.0.0}
          if [[ -n "$VERSION_INPUT" ]]; then
            version="${VERSION_INPUT#v}"
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            case "$BUMP" in
              major) version="$((major + 1)).0.0" ;;
              minor) version="$major.$((minor + 1)).0" ;;
              *)     version="$major.$minor.$((patch + 1))" ;;
            esac
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a version like 1.2.3 or 1.2.3-beta.1"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists"; exit 1
          fi
          if git ls-remote --exit-code --heads origin "release/v$version" >/dev/null; then
            echo "::error::Branch release/v$version already exists"; exit 1
          fi
          echo "Last release: $last, new: v$version"
          echo "version=$version" >> "$GITHUB_ENV"
          echo "last=$last" >> "$GITHUB_ENV"

      - name: Create the release branch
        run: git push origin "$sha:refs/heads/release/v$version"

      - name: Open the pull request into main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          range="origin/main..$sha"
          {
            echo "Release **v$version** from \`develop\` at ${sha::7}."
            echo
            echo "Merging this tags \`v$version\`, builds the app and publishes the GitHub Release."
            echo "Merge with a merge commit, not a squash."
            echo
            echo "### Changes since $last"
            git log --no-merges --format='- %s (%h)' "$range"
          } > body.md
          gh pr create --base main --head "release/v$version" --title "Release v$version" --body-file body.md
          echo "### Opened the pull request for v$version" >> "$GITHUB_STEP_SUMMARY"

      # Pull requests opened with the workflow token don't start other workflows. "build" already
      # passed on this exact commit (it's develop's), so only the main-source check is started here.
      - name: Run the source check
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run main-source.yml --ref "release/v$version"
